[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/shiprocket-fetch"
  to = "/.netlify/functions/shiprocket-fetch"
  status = 200

[[redirects]]
  from = "/api/tracking-webhook"
  to = "/.netlify/functions/tracking-webhook"
  status = 200

[[redirects]]
  from = "/api/shiprocket-sync"
  to = "/.netlify/functions/shiprocket-sync"
  status = 200

[[redirects]]
  from = "/api/bolna-call"
  to = "/.netlify/functions/bolna-call"
  status = 200

[[redirects]]
  from = "/api/bolna-webhook"
  to = "/.netlify/functions/bolna-webhook"
  status = 200

[[redirects]]
  from = "/api/bolna-callback"
  to = "/.netlify/functions/bolna-webhook"
  status = 200

[[redirects]]
  from = "/api/shopify-webhook"
  to = "/.netlify/functions/shopify-webhook"
  status = 200

[[redirects]]
  from = "/api/shopify-sync"
  to = "/.netlify/functions/shopify-sync"
  status = 200

[[redirects]]
  from = "/api/shopify-order-action"
  to = "/.netlify/functions/shopify-order-action"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
